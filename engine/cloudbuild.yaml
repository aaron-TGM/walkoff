# Builds the engine image with Cloud Build. Run from the repo root:
#   gcloud builds submit --config engine/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - engine/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/walkoff/engine:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/walkoff/engine:latest
